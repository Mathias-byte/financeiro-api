services:
  condominio-financeiro-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: condominio-financeiro-api:latest

    container_name: condominio-financeiro-api

    ports:
      - "7523:7523"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: "7523"
